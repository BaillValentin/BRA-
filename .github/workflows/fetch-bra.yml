name: Fetch BRA Data

on:
  schedule:
    - cron: '0 6,8,10,12,14,16,18,20 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install poppler-utils for PDF image extraction
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Fetch BRA data
        env:
          MF_API_KEY: ${{ secrets.MF_API_KEY }}
        run: node scripts/fetch-bra.js

      - name: Extract individual images from PDFs
        run: |
          mkdir -p data/bra/img
          for pdf in data/bra/*.pdf; do
            name=$(basename "$pdf" .pdf)
            # Extract all embedded images as PNG
            pdfimages -png "$pdf" "data/bra/img/${name}"
            # List what was extracted (debug, first PDF only)
            if [ "$name" = "CHABLAIS" ]; then
              echo "=== Images extracted from $name ==="
              ls -la data/bra/img/${name}-*.png 2>/dev/null || echo "No images"
              # Show image sizes to identify them
              for img in data/bra/img/${name}-*.png; do
                if [ -f "$img" ]; then
                  dims=$(identify -format "%wx%h" "$img" 2>/dev/null || echo "?x?")
                  echo "  $(basename $img): ${dims}"
                fi
              done
            fi
          done
          echo "Total images: $(ls data/bra/img/*.png 2>/dev/null | wc -l)"

      - name: Update JSON with image paths
        run: |
          for json in data/bra/*.json; do
            name=$(basename "$json" .json)
            if [ "$name" = "latest" ]; then continue; fi
            # Find all extracted images for this massif
            node -e "
              const fs = require('fs');
              const path = require('path');
              const d = JSON.parse(fs.readFileSync('$json','utf8'));
              const imgDir = 'data/bra/img';
              const prefix = '${name}-';
              const files = fs.readdirSync(imgDir)
                .filter(f => f.startsWith(prefix) && f.endsWith('.png'))
                .sort();
              if (files.length > 0) {
                d.extractedImages = files.map(f => './data/bra/img/' + f);
              }
              fs.writeFileSync('$json', JSON.stringify(d, null, 2));
            "
          done

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bra/
          git diff --staged --quiet || git commit -m "chore: update BRA data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
