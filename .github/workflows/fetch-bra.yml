name: Fetch BRA Data

on:
  schedule:
    - cron: '0 6,8,10,12,14,16,18,20 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install poppler-utils for PDF image extraction
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Fetch BRA data
        env:
          MF_API_KEY: ${{ secrets.MF_API_KEY }}
        run: node scripts/fetch-bra.js

      - name: Extract illustrations from PDFs
        run: |
          mkdir -p data/bra/img
          for pdf in data/bra/*.pdf; do
            name=$(basename "$pdf" .pdf)
            # Extract embedded images
            pdfimages -png "$pdf" "data/bra/img/${name}"
            # Delete tiny images (<15KB = icons/decorations), keep real illustrations
            find data/bra/img -name "${name}-*.png" -size -15k -delete
          done
          # Debug: show what's left for CHABLAIS
          echo "=== Illustrations kept for CHABLAIS ==="
          ls -lhS data/bra/img/CHABLAIS-*.png 2>/dev/null || echo "None"
          echo "Total illustrations: $(ls data/bra/img/*.png 2>/dev/null | wc -l)"

      - name: Update JSON with image paths
        run: |
          for json in data/bra/*.json; do
            name=$(basename "$json" .json)
            if [ "$name" = "latest" ]; then continue; fi
            node -e "
              const fs = require('fs');
              const d = JSON.parse(fs.readFileSync('$json','utf8'));
              const files = fs.readdirSync('data/bra/img')
                .filter(f => f.startsWith('${name}-') && f.endsWith('.png'))
                .sort();
              if (files.length > 0) {
                d.extractedImages = files.map(f => './data/bra/img/' + f);
              }
              fs.writeFileSync('$json', JSON.stringify(d, null, 2));
            "
          done

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bra/
          git diff --staged --quiet || git commit -m "chore: update BRA data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
