<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="64" ry="64" fill="#1a1a2e"/>

  <!-- Definitions -->
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a4e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="roundClip">
      <rect width="512" height="512" rx="64" ry="64"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundClip)">
    <!-- Sky background -->
    <rect width="512" height="512" fill="url(#skyGrad)"/>

    <!-- Back mountain (lighter) -->
    <polygon points="50,415 200,175 350,415" fill="#3a3a5e" opacity="0.7"/>

    <!-- Main mountain (white) -->
    <polygon points="145,415 293,135 440,415" fill="#ffffff"/>

    <!-- Snow cap detail on main mountain -->
    <polygon points="293,135 252,215 293,193 334,215" fill="#e8e8f0"/>

    <!-- Front-left mountain ridge -->
    <polygon points="10,415 133,240 255,415" fill="#d0d0e0" opacity="0.8"/>

    <!-- Ground/base -->
    <rect x="0" y="400" width="512" height="112" fill="#1a1a2e"/>

    <!-- Avalanche risk diamond (warning indicator) -->
    <g transform="translate(368, 140)">
      <!-- Diamond shadow -->
      <polygon points="0,-80 80,0 0,80 -80,0" fill="#000000" opacity="0.3" transform="translate(4,4)"/>
      <!-- Diamond shape -->
      <polygon points="0,-80 80,0 0,80 -80,0" fill="#FF9500"/>
      <!-- Diamond border -->
      <polygon points="0,-80 80,0 0,80 -80,0" fill="none" stroke="#FFD60A" stroke-width="4"/>
      <!-- BRA text inside diamond -->
      <text x="0" y="5" text-anchor="middle" dominant-baseline="middle"
            font-family="Arial, Helvetica, sans-serif" font-weight="bold"
            font-size="38" fill="#1a1a2e" letter-spacing="2">BRA</text>
    </g>

    <!-- Snowflakes for atmosphere -->
    <circle cx="80" cy="80" r="5" fill="#ffffff" opacity="0.4"/>
    <circle cx="185" cy="55" r="4" fill="#ffffff" opacity="0.3"/>
    <circle cx="140" cy="120" r="3" fill="#ffffff" opacity="0.25"/>
    <circle cx="415" cy="350" r="4" fill="#ffffff" opacity="0.3"/>
    <circle cx="455" cy="95" r="3" fill="#ffffff" opacity="0.2"/>
    <circle cx="60" cy="200" r="2.5" fill="#ffffff" opacity="0.2"/>
    <circle cx="480" cy="280" r="3" fill="#ffffff" opacity="0.15"/>

    <!-- Risk scale bar at bottom -->
    <rect x="50" y="432" width="95" height="14" rx="7" fill="#52B788"/>
    <rect x="153" y="432" width="95" height="14" rx="7" fill="#FFD60A"/>
    <rect x="256" y="432" width="95" height="14" rx="7" fill="#FF9500"/>
    <rect x="359" y="432" width="95" height="14" rx="7" fill="#FF3B30"/>
  </g>
</svg>