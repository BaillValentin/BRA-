name: Fetch BRA Data

on:
  schedule:
    # Every 2 hours during daytime (BRA published ~16h local)
    - cron: '0 6,8,10,12,14,16,18,20 * * *'
  workflow_dispatch: # Manual trigger

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Fetch BRA data
        env:
          MF_API_KEY: ${{ secrets.MF_API_KEY }}
        run: node scripts/fetch-bra.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bra/
          git diff --staged --quiet || git commit -m "chore: update BRA data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
