name: Fetch BRA Data

on:
  schedule:
    - cron: '10 16 * * *'  # 17h10 FR - premier essai
    - cron: '30 16 * * *'  # 17h30 FR - retry si rien à 17h10
    - cron: '30 7 * * *'   # 8h30 FR - amendements matinaux
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Fetch BRA data
        env:
          MF_API_KEY: ${{ secrets.MF_API_KEY }}
        run: node scripts/fetch-bra.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bra/
          git diff --staged --quiet || git commit -m "chore: update BRA data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
