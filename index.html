<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <title>BRA Alpes - Risque Avalanche</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <p>Chargement des données...</p>
  </div>

  <div id="map"></div>

  <!-- Map mode toggle -->
  <div id="map-toggle" class="map-toggle">
    <button class="map-toggle-btn active" data-mode="risque" onclick="MapManager.setMode('risque')">Risque</button>
    <button class="map-toggle-btn" data-mode="enneigement" onclick="MapManager.setMode('enneigement')">Enneigement</button>
    <button class="map-toggle-btn" data-mode="pentes" onclick="MapManager.setMode('pentes')">Pentes</button>
  </div>

  <!-- Refuges toggle -->
  <button id="refuges-btn" class="map-action-btn" title="Afficher les refuges" onclick="MapManager.toggleRefuges()" style="top:80px;right:60px;">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 21l9-18 9 18H3z"/>
      <line x1="12" y1="11" x2="12" y2="17"/>
    </svg>
  </button>

  <!-- Compare button -->
  <button id="compare-btn" class="compare-btn" title="Comparer 2 massifs" onclick="MapManager.toggleCompare()">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
    </svg>
  </button>

  <!-- Compare banner -->
  <div id="compare-banner" class="compare-banner hidden">
    <span id="compare-text">Sélectionnez le 1er massif</span>
    <button onclick="MapManager.cancelCompare()">Annuler</button>
  </div>

  <!-- Compare panel -->
  <div id="compare-panel" class="compare-panel hidden">
    <div class="compare-header">
      <h2>Comparaison</h2>
      <button class="panel-close" onclick="MapManager.closeCompare()">&times;</button>
    </div>
    <div class="compare-content" id="compare-content"></div>
  </div>

  <button id="geolocate" title="Ma position">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/>
      <line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>
    </svg>
  </button>

  <div id="legend">
    <div class="legend-item"><span class="legend-color" style="background:#52B788;"></span><span>1 - Faible</span></div>
    <div class="legend-item"><span class="legend-color" style="background:#FFD60A;"></span><span>2 - Limité</span></div>
    <div class="legend-item"><span class="legend-color" style="background:#FF9500;"></span><span>3 - Marqué</span></div>
    <div class="legend-item"><span class="legend-color" style="background:#FF3B30;"></span><span>4 - Fort</span></div>
    <div class="legend-item"><span class="legend-color legend-color-5"></span><span>5 - Très fort</span></div>
  </div>

  <!-- Slope legend -->
  <div id="slope-legend" class="slope-legend" style="display:none;">
    <div class="legend-title">Inclinaison</div>
    <div class="legend-item"><span class="legend-color" style="background:#FFFF00;"></span><span>30° - 35°</span></div>
    <div class="legend-item"><span class="legend-color" style="background:#FF8C00;"></span><span>35° - 40°</span></div>
    <div class="legend-item"><span class="legend-color" style="background:#FF0000;"></span><span>40° - 45°</span></div>
    <div class="legend-item"><span class="legend-color" style="background:#FF00FF;"></span><span>&gt; 45°</span></div>
  </div>

  <div id="panel">
    <div class="panel-header">
      <div class="drag-handle"></div>
      <button class="panel-close">&times;</button>
      <h2 id="panel-title"></h2>
      <span id="panel-risk-badge" class="risk-badge"></span>
    </div>
    <div class="panel-content" id="panel-content"></div>
  </div>

  <div id="pdf-overlay" class="pdf-overlay hidden">
    <button id="pdf-back" class="pdf-back-btn">← Retour</button>
    <iframe id="pdf-frame" class="pdf-frame"></iframe>
  </div>

  <!-- Offline indicator -->
  <div id="offline-banner" class="offline-banner hidden">Mode hors-ligne</div>

  <div id="update-info"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/map.js"></script>
  <script src="js/panel.js"></script>
  <script src="js/app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
